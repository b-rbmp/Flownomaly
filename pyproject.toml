[project]
name = "flownomaly"
version = "1.0.0"
description = "Reproduction code for Flownomaly"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "adeval==1.1.0",
    "h5py==3.16.0",
    "numpy==2.4.6",
    "opencv-python==4.13.0.92",
    "pillow==12.2.0",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "tqdm==4.68.2",
]

[project.scripts]
flownomaly-train = "flownomaly.cli.train:main"
flownomaly-infer = "flownomaly.cli.infer:main"
flownomaly-evaluate = "flownomaly.cli.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flownomaly"]
